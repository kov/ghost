[package]
name = "ghost-vt"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Run a terminal in the background and reattach without losing scrollback, mouse, or keybindings."

[dependencies]
dirs = "6.0.0"
libc = "0.2.186"
nix = { version = "0.31.3", features = ["signal"] }
# Watches the session directory for `ghost __watch` — which runs on the *remote*,
# so this crate's macOS build is the staged prebuilt's. `macos_fsevent` (the
# default) pulls `fsevent-sys`, and with it the CoreServices and CoreFoundation
# frameworks, which only Apple's SDK carries: that single dependency is what made
# a macOS prebuilt un-cross-buildable and left it stale. kqueue needs no
# framework, so the darwin prebuilts now link from Linux with `GHOST_ZIGBUILD=1`
# alone. It watches per-descriptor rather than subscribing to a tree, so it is the
# weaker watcher on a large one — irrelevant here, where a session directory holds
# a handful of entries and the watch is only a trigger to rescan (`watch.rs`).
notify = { version = "8.2", default-features = false, features = ["macos_kqueue"] }
postcard = { version = "1.1.3", features = ["alloc"] }
pty-process = "0.5.3"
rustix = { version = "1.1.4", features = ["event", "termios", "process", "fs", "stdio", "pipe"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# Unlinked temp file backing the checkpoint a self-upgrade hands its successor
# across the re-exec (portable stand-in for a Linux-only memfd). See
# `server::self_upgrade`.
tempfile = "3"
# ghost's owned terminal-emulator core (forked from asciinema's avt; Apache-2.0).
ghost-term = { path = "../ghost-term" }
# Recording compression. Brotli is pure Rust (unlike zstd's bundled C), so the
# crate — and the headless binary staged to remotes — cross-compiles with only a
# Rust target. See `record::compress`.
brotli = "8"

[dev-dependencies]
tempfile = "3"
proptest = "=1.9.0"
