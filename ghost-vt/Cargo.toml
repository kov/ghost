[package]
name = "ghost-vt"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Run a terminal in the background and reattach without losing scrollback, mouse, or keybindings."

[dependencies]
dirs = "6.0.0"
libc = "0.2.186"
nix = { version = "0.31.3", features = ["signal"] }
# Watches the session directory for `ghost __watch` and for the fleet's
# set-change trigger. Left on the default `macos_fsevent` backend deliberately:
# `macos_kqueue` cannot watch a session directory at all. kqueue watches per file
# descriptor, so it must `open()` every entry — and these directories are full of
# unix sockets, which `open()` refuses with ENOTSUP. The watch then fails to bind,
# `__watch` exits before its first listing, and a mac's whole remote fleet goes
# dark (measured on real hardware: "Operation not supported on socket (os error
# 102)"). Every macOS build is affected, not just the staged prebuilt.
#
# The cost is that `fsevent-sys` needs the CoreServices and CoreFoundation
# frameworks, so cross-building the darwin prebuilts needs a macOS SDK on hand
# (see `xtask`) rather than zig alone.
notify = "8.2"
postcard = { version = "1.1.3", features = ["alloc"] }
pty-process = "0.5.3"
rustix = { version = "1.1.4", features = ["event", "termios", "process", "fs", "stdio", "pipe"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# Unlinked temp file backing the checkpoint a self-upgrade hands its successor
# across the re-exec (portable stand-in for a Linux-only memfd). See
# `server::self_upgrade`.
tempfile = "3"
# ghost's owned terminal-emulator core (forked from asciinema's avt; Apache-2.0).
ghost-term = { path = "../ghost-term" }
# Recording compression. Brotli is pure Rust (unlike zstd's bundled C), so the
# crate — and the headless binary staged to remotes — cross-compiles with only a
# Rust target. See `record::compress`.
brotli = "8"

[dev-dependencies]
tempfile = "3"
proptest = "=1.9.0"
