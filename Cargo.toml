[workspace]
resolver = "3"
members = [
    "ghost-term",
    "ghost-vt",
    "ghost-render",
    "ghost-cli",
    # Headless ghost (host + transport, no GUI) — the binary staged to remotes.
    "ghost-host",
    # The custom GPU frontend (winit/wgpu/swash). First-class workspace members:
    # `ghost` (the GUI binary) is the headline product; the rest are its crates.
    "ghost-ui-core",
    "ghost-shaper",
    "ghost-renderer",
    "ghost-ui-harness",
    "ghost-ui",
    "ghost-shot",
    "xtask",
]
# The vendored winit and wgpu-core (see the patches below) are their own
# packages, not members.
exclude = ["vendor/winit", "vendor/wgpu-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# Optimized build that keeps symbols, for profiling with perf/valgrind.
# Select with `cargo build --profile profiling`.
[profile.profiling]
inherits = "release"
debug = true

# Vendored winit 0.30.13 carrying seven local patches, each to be reported
# upstream and then dropped. Every addition is marked `[vendored addition]` in
# vendor/winit/src/platform/wayland.rs, which is the list to check this one
# against — it has fallen behind before:
# - `is_stateless()` recognises partially-tiled / snapped windows so the window
#   restores to its pre-snap size on Wayland/GNOME — see
#   vendor/winit/.../linux/wayland/window/state.rs (winit + smithay-client-toolkit).
# - macOS `insertText:` commits text arriving outside a key event (the
#   Character Viewer / Ctrl-Cmd-Space emoji palette, dictation), which the
#   marked-text-only gate silently dropped — see
#   vendor/winit/.../macos/view.rs (upstream winit#3342, milestoned 0.31).
# - Wayland backdrop blur only spoke KDE's `org_kde_kwin_blur`. Added the
#   cross-desktop `ext_background_effect_v1` (preferred where offered, KDE's
#   otherwise) plus `WindowExtWayland::blur_supported`, so a client can tell
#   whether its blur request was actually honoured and draw its own fallback
#   glass when it wasn't — see vendor/winit/.../wayland/types/background_effect.rs.
# - The xdg tiled state was consumed internally and never surfaced, so a client
#   could not tell a snapped window from a floating one — and a window that
#   rounds its corners, casts a shadow or offers resize handles has to drop all
#   three where it is tiled, exactly as when maximized (which a snapped window
#   is not). Added `WindowExtWayland::is_tiled` — see
#   vendor/winit/.../wayland/window/mod.rs.
# - With `decorations(false)` the surface IS the window, so there is nowhere
#   outside it to cast a shadow. `set_decoration_margins` grows the surface and
#   points `xdg_surface.set_window_geometry` at the inner rect, so the
#   compositor still snaps/maximizes/tiles to the window while we paint the ring
#   around it — GTK's model (`_GTK_FRAME_EXTENTS`). This is what lets ghost's own
#   frame cast a shadow at all.
# - `set_present_size` states the size a buffer is about to be committed at, so
#   the blur region reaches the compositor with the frame it describes rather
#   than a configure ahead of it — see [present-time window state].
# - xdg-session-management: `with_session_toplevel` names a window in the
#   compositor's session so it reopens where it was, `open_session` /
#   `session_restored` drive and report the restore. Not a fix but a protocol
#   winit does not speak yet.
#
# Vendored wgpu-core 29.0.3 carrying one local patch, to be reported upstream
# and then dropped:
# - `surface_get_current_texture` allocated the texture id *before* the
#   acquire and leaked the index when the acquire failed or returned no
#   texture (Timeout/Occluded/Outdated). Each leaked index later becomes a
#   permanent 24-byte `Vacant` slot in the textures registry — a render loop
#   retrying an unacquirable surface leaks without bound (observed: 300M+
#   burned ids, ~8GB, in one overnight session). The id is now allocated only
#   once there is a texture to assign — see vendor/wgpu-core/src/present.rs.
#
# sctk-adwaita was vendored here too, for the CSD frame winit drew our windows
# with. ghost draws its own frame now, so the frame, the crate and the four
# patches we carried on it are all gone — the two pieces still worth having, the
# libadwaita-fitted shadow curve and the Adwaita palette, were adopted outright
# (ghost-renderer/src/shadow.rs and ghost-ui/src/desktop.rs). winit's
# `wayland-csd-adwaita` feature is off for the same reason.
[patch.crates-io]
winit = { path = "vendor/winit" }
wgpu-core = { path = "vendor/wgpu-core" }
