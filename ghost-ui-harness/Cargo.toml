[package]
name = "ghost-ui-harness"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Headless driver of the real ghost-ui frontend (model + renderer + damage) for tests and benchmarks, plus shared frame-pacing instrumentation."
publish = false

[dependencies]
ghost-ui-core = { path = "../ghost-ui-core" }
ghost-renderer = { path = "../ghost-renderer" }
ghost-shaper = { path = "../ghost-shaper" }
ghost-render = { path = "../ghost-render" }
ghost-vt = { path = "../ghost-vt" }

[dev-dependencies]
# Only the optional windowed test (tests/windowed.rs) needs a real window + surface.
# winit resolves to the workspace's vendored copy via [patch.crates-io]; wgpu/pollster
# match the app so the surface device and the renderer device are the same wgpu.
# Default features minus `wayland-csd-adwaita`: winit only builds a CSD frame for a
# window that asks to be decorated, and ghost never does — it draws its own. Off,
# the whole Adwaita frame (and tiny-skia, and ab_glyph) leaves the build.
winit = { version = "0.30", default-features = false, features = [
    "rwh_06",
    "x11",
    "wayland",
    "wayland-dlopen",
] }
wgpu = "29"
pollster = "0.4"
